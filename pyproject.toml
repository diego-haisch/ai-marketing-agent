[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "applychain-linkedin-stats"
version = "0.1.0"
description = "Histórico de métricas de LinkedIn (ADR-0001)"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages]
find = { where = ["src"], include = ["linkedin_stats*"] }

[project.scripts]
linkedin-stats = "linkedin_stats.main:main"
